<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<title>ESP32 Web Bluetooth 控制台</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, sans-serif;
			background: #1a1a2e;
			color: #eee;
			padding: 20px;
			max-width: 650px;
			margin: 0 auto;
		}

		h1 {
			text-align: center;
			margin-bottom: 16px;
			color: #00d4aa;
			font-size: 18px;
		}

		.card {
			background: #16213e;
			border-radius: 10px;
			padding: 16px;
			margin-bottom: 14px;
		}

		.card h3 {
			margin-bottom: 10px;
			color: #00d4aa;
			font-size: 13px;
			text-transform: uppercase;
		}

		button {
			background: #00d4aa;
			color: #1a1a2e;
			border: none;
			padding: 8px 16px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 13px;
			font-weight: bold;
			margin-right: 6px;
			margin-bottom: 4px;
		}

		button:hover {
			background: #00e6b8;
		}

		button:disabled {
			background: #555;
			cursor: not-allowed;
		}

		button.danger {
			background: #e74c3c;
			color: #fff;
		}

		button.scan {
			background: #3498db;
			color: #fff;
		}

		button.connect {
			background: #f39c12;
			color: #fff;
			font-size: 11px;
			padding: 4px 10px;
		}

		input {
			width: 100%;
			padding: 8px;
			border-radius: 6px;
			border: 1px solid #333;
			background: #0f3460;
			color: #eee;
			font-family: monospace;
			font-size: 12px;
			margin-bottom: 8px;
		}

		.status {
			font-size: 11px;
			padding: 4px 8px;
			border-radius: 4px;
			display: inline-block;
			margin-bottom: 8px;
		}

		.status.ok {
			background: #27ae60;
		}

		.status.idle {
			background: #555;
			color: #ccc;
		}

		.log {
			background: #0a0a1a;
			border-radius: 6px;
			padding: 10px;
			max-height: 220px;
			overflow-y: auto;
			font-family: monospace;
			font-size: 11px;
			white-space: pre-wrap;
			word-break: break-all;
		}

		.dev-item {
			background: #0f3460;
			border-radius: 6px;
			padding: 8px 10px;
			margin-bottom: 6px;
			font-size: 12px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.dev-item .info {
			font-family: monospace;
		}

		.flex-row {
			display: flex;
			gap: 8px;
			align-items: center;
			margin-bottom: 8px;
			flex-wrap: wrap;
		}
	</style>
</head>

<body>
	<h1>ESP32 Web Bluetooth 控制台</h1>

	<div class="card">
		<h3>设备连接</h3>
		<div class="flex-row">
			<button id="btnConnect" onclick="connect()">连接 ESP32</button>
			<button id="btnDisconnect" class="danger" onclick="disconnect()" disabled>断开</button>
		</div>
		<span id="connStatus" class="status idle">未连接</span>
	</div>

	<div class="card">
		<h3>BLE Central — 扫描/连接外设</h3>
		<div class="flex-row">
			<button id="btnScan" class="scan" onclick="startScan()" disabled>扫描 BLE 设备</button>
			<button id="btnScanBt" class="scan" onclick="startBtScan()" disabled>扫描经典蓝牙</button>
		</div>
		<div id="devList"><span style="font-size:12px;color:#888;">点击扫描后，设备列表显示在这里</span></div>
	</div>

	<div class="card">
		<h3>音量控制</h3>
		<div class="flex-row">
			<button id="btnVolUp" onclick="sendCmd('VOLUP')" disabled>🔊 音量+</button>
			<button id="btnVolDown" onclick="sendCmd('VOLDOWN')" disabled>🔉 音量-</button>
		</div>
	</div>

	<div class="card">
		<h3>NVS 数据读写</h3>
		<input id="hexInput" placeholder="HEX: 48 65 6c 6c 6f (Hello)">
		<div class="flex-row">
			<button id="btnSend" onclick="writeData()" disabled>写入 NVS</button>
			<button id="btnRead" onclick="readData()" disabled>读取 NVS</button>
		</div>
		<div id="readResult" style="font-size:12px; color:#00d4aa; font-family:monospace;"></div>
	</div>

	<div class="card">
		<h3>日志（自动刷新）</h3>
		<div class="log" id="logArea">等待连接...</div>
		<button style="margin-top:6px; font-size:11px; padding:4px 8px;"
			onclick="document.getElementById('logArea').textContent=''">清空</button>
	</div>

	<script>
		const SVC_UUID = '12345678-1234-1234-1234-123456789abc'
		const CHAR_UUID = '87654321-4321-4321-4321-cba987654321'
		let device, server, characteristic, logTimer, lastLog = ''
		let devices = {}  // 扫描到的设备 {addr: {name, rssi}}

		function log (m) {
			const a = document.getElementById('logArea')
			a.textContent += '[' + new Date().toLocaleTimeString() + '] ' + m + '\n'
			a.scrollTop = a.scrollHeight
		}

		function setUI (ok) {
			['btnConnect', 'btnDisconnect', 'btnScan', 'btnScanBt', 'btnSend', 'btnRead', 'btnVolUp', 'btnVolDown'].forEach((id, i) => { document.getElementById(id).disabled = ok ? (i === 0) : (i !== 0) })
			const s = document.getElementById('connStatus'); s.textContent = ok ? '已连接' : '未连接'; s.className = 'status ' + (ok ? 'ok' : 'idle')
		}

		// 解析 DEV|addr|type|rssi|name 格式行（BLE 设备，过滤弱信号），只更新 devices
		function handleDevLog (line) {
			const parts = line.split('|')
			if (parts.length >= 5) {
				const addr = parts[1], type = parts[2], rssi = parts[3], name = parts[4]
				if (parseInt(rssi) < -60) return  // 只保留 RSSI >= -60 dBm 的强信号设备
				devices[addr] = { name, rssi, type }
			}
		}

		// 解析 BTDEV|addr|rssi|name 格式行（经典蓝牙设备）
		function handleBtDevLog (line) {
			const parts = line.split('|')
			if (parts.length >= 4) {
				const addr = parts[1], rssi = parts[2], name = parts[3]
				devices[addr] = { name, rssi, type: 'bt' }
			}
		}

		// 开始扫描：先清空设备列表，再发送 SCAN 命令
		async function startScan () {
			devices = {}
			renderDevices()
			await sendCmd('SCAN')
		}

		// 开始经典蓝牙扫描
		async function startBtScan () {
			devices = {}
			renderDevices()
			await sendCmd('BTSCAN')
		}

		// 全量解析累积日志：DEV 行→设备列表（增量累积，不清空），其他行→日志区
		function renderLogs (text) {
			const logLines = []
			const lines = text.split('\n')
			for (const line of lines) {
				const s = line.trim()
				if (!s) continue
				if (s.startsWith('DEV|')) handleDevLog(s)
				else if (s.startsWith('BTDEV|')) handleBtDevLog(s)
				else logLines.push(s)
			}
			const a = document.getElementById('logArea')
			a.textContent = logLines.length ? logLines.join('\n') : '等待日志...'
			a.scrollTop = a.scrollHeight
			renderDevices()
		}

		function renderDevices () {
			const list = document.getElementById('devList')
			const addrs = Object.keys(devices)
			if (addrs.length === 0) { list.innerHTML = '<span style="font-size:12px;color:#888;">暂无设备</span>'; return }
			list.innerHTML = ''
			for (const addr of addrs) {
				const d = devices[addr]
				const item = document.createElement('div')
				item.className = 'dev-item'
				item.innerHTML = '<span class="info">' + addr + ' | ' + d.name + ' | RSSI:' + d.rssi + '</span>'
				const isBt = (d.type === 'bt')
				const btn = document.createElement('button')
				btn.className = 'connect'
				btn.textContent = isBt ? 'BT连接' : '连接'
				btn.onclick = () => {
					if (isBt) { sendCmd('BTCONNECT ' + addr); log('请求 BT 连接: ' + addr) }
					else { sendCmd('CONNECT ' + addr + ' ' + d.type); log('请求连接: ' + addr + ' type=' + d.type) }
				}
				item.appendChild(btn)
				list.appendChild(item)
			}
		}

		async function connect () {
			try {
				log('搜索 BLE 设备...')
				// 按名称前缀过滤，只显示 ESP32（设备名 BLE-HID）
				device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BLE-HID' }], optionalServices: [SVC_UUID] })
				device.addEventListener('gattserverdisconnected', () => { log('设备断开'); setUI(false); clearInterval(logTimer) })
				server = await device.gatt.connect()
				const svc = await server.getPrimaryService(SVC_UUID)
				characteristic = await svc.getCharacteristic(CHAR_UUID)
				log('连接成功！')
				setUI(true)
				logTimer = setInterval(async () => {
					try {
						const v = await characteristic.readValue()
						const t = new TextDecoder().decode(new Uint8Array(v.buffer)).replace(/\0+$/, '').trim()
						if (t && t !== lastLog) { lastLog = t; renderLogs(t) }
					} catch (e) { }
				}, 1000)
			} catch (e) { log('失败: ' + e.message) }
		}

		function disconnect () { clearInterval(logTimer); if (device && device.gatt.connected) { device.gatt.disconnect(); log('已断开'); setUI(false) } }

		async function sendCmd (cmd) {
			try { await characteristic.writeValue(new TextEncoder().encode('CMD:' + cmd)); log('发送命令: ' + cmd) } catch (e) { log('命令失败: ' + e.message) }
		}

		async function writeData () {
			const h = document.getElementById('hexInput').value.trim().replace(/\s/g, '')
			if (!h || h.length % 2) { log('HEX格式错误'); return }
			const d = new Uint8Array(h.length / 2)
			for (let i = 0; i < h.length; i += 2)d[i / 2] = parseInt(h.substr(i, 2), 16)
			try { await characteristic.writeValue(d); log('已写入: ' + Array.from(d).map(b => b.toString(16).padStart(2, '0')).join(' ')) } catch (e) { log('失败: ' + e.message) }
		}

		async function readData () {
			try { const v = await characteristic.readValue(); const b = new Uint8Array(v.buffer); let t = b.length; while (t > 0 && b[t - 1] === 0) t--; const txt = t > 0 ? String.fromCharCode(...b.slice(0, t)) : '(空)'; document.getElementById('readResult').textContent = 'HEX: ' + Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ') + '\nASCII: ' + txt; log('读取(' + t + '字节): ' + txt) } catch (e) { log('失败: ' + e.message) }
		}

		window.onload = () => { if (!('bluetooth' in navigator)) { log('请使用 Chrome/Edge') } else { log('Web Bluetooth 就绪') } };
	</script>
</body>

</html>
