<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<title>ESP32 Web Bluetooth 配置工具</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, sans-serif;
			background: #1a1a2e;
			color: #eee;
			padding: 20px;
			max-width: 600px;
			margin: 0 auto;
		}

		h1 {
			text-align: center;
			margin-bottom: 20px;
			color: #00d4aa;
		}

		.card {
			background: #16213e;
			border-radius: 10px;
			padding: 20px;
			margin-bottom: 16px;
		}

		.card h3 {
			margin-bottom: 12px;
			color: #00d4aa;
			font-size: 14px;
			text-transform: uppercase;
		}

		button {
			background: #00d4aa;
			color: #1a1a2e;
			border: none;
			padding: 10px 20px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			font-weight: bold;
		}

		button:hover {
			background: #00e6b8;
		}

		button:disabled {
			background: #555;
			cursor: not-allowed;
		}

		button.danger {
			background: #e74c3c;
			color: #fff;
		}

		input {
			width: 100%;
			padding: 10px;
			border-radius: 6px;
			border: 1px solid #333;
			background: #0f3460;
			color: #eee;
			font-family: monospace;
			font-size: 13px;
			margin-bottom: 10px;
		}

		.status {
			font-size: 12px;
			padding: 6px 10px;
			border-radius: 4px;
			display: inline-block;
			margin-bottom: 10px;
		}

		.status.ok {
			background: #27ae60;
			color: #fff;
		}

		.status.err {
			background: #e74c3c;
			color: #fff;
		}

		.status.idle {
			background: #555;
			color: #ccc;
		}

		.log {
			background: #0a0a1a;
			border-radius: 6px;
			padding: 12px;
			max-height: 200px;
			overflow-y: auto;
			font-family: monospace;
			font-size: 11px;
			white-space: pre-wrap;
			word-break: break-all;
		}

		.flex-row {
			display: flex;
			gap: 10px;
			align-items: center;
			margin-bottom: 10px;
			flex-wrap: wrap;
		}

		label {
			font-size: 12px;
			color: #aaa;
			display: block;
			margin-bottom: 4px;
		}
	</style>
</head>

<body>
	<h1>ESP32 Web Bluetooth 配置工具</h1>

	<div class="card">
		<h3>设备连接</h3>
		<div class="flex-row">
			<button id="btnConnect" onclick="connect()">连接 ESP32</button>
			<button id="btnDisconnect" class="danger" onclick="disconnect()" disabled>断开</button>
		</div>
		<span id="connStatus" class="status idle">未连接</span>
		<div id="deviceInfo" style="font-size:12px; color:#aaa;"></div>
	</div>

	<div class="card">
		<h3>写入数据（保存到 NVS）</h3>
		<label>HEX 格式，如: 48 65 6c 6c 6f</label>
		<input id="hexInput" placeholder="48 65 6c 6c 6f (Hello)">
		<div class="flex-row">
			<button id="btnSend" onclick="writeData()" disabled>写入并保存</button>
			<button onclick="document.getElementById('hexInput').value=''">清空</button>
		</div>
	</div>

	<div class="card">
		<h3>读取数据</h3>
		<button id="btnRead" onclick="readData()" disabled>读取 NVS 数据</button>
		<div id="readResult" style="margin-top:10px; font-family:monospace; font-size:12px; color:#00d4aa;"></div>
	</div>

	<div class="card">
		<h3>ESP32 日志（自动刷新）</h3>
		<div class="log" id="logArea">等待连接...</div>
		<button style="margin-top:8px; font-size:11px; padding:4px 10px;"
			onclick="document.getElementById('logArea').textContent=''">清空</button>
	</div>

	<script>
		const SVC_UUID = '12345678-1234-1234-1234-123456789abc'
		const CHAR_UUID = '87654321-4321-4321-4321-cba987654321'

		let device = null, server = null, characteristic = null, logTimer = null, lastLog = ''

		function log (msg) {
			const a = document.getElementById('logArea')
			a.textContent += '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n'
			a.scrollTop = a.scrollHeight
		}

		function setUI (ok) {
			['btnConnect', 'btnDisconnect', 'btnSend', 'btnRead'].forEach((id, i) => {
				document.getElementById(id).disabled = ok ? (i === 0) : (i !== 0)
			})
			const s = document.getElementById('connStatus')
			s.textContent = ok ? '已连接' : '未连接'
			s.className = 'status ' + (ok ? 'ok' : 'idle')
		}

		async function connect () {
			try {
				log('搜索 BLE 设备...')
				device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SVC_UUID] })
				log('已发现: ' + (device.name || 'HID') + ', 连接 GATT...')
				device.addEventListener('gattserverdisconnected', () => { log('设备断开'); setUI(false); clearInterval(logTimer) })
				server = await device.gatt.connect()
				log('GATT 已连接, 获取服务...')
				const svc = await server.getPrimaryService(SVC_UUID)
				characteristic = await svc.getCharacteristic(CHAR_UUID)
				document.getElementById('deviceInfo').textContent = '设备: ' + (device.name || 'ESP32')
				log('连接成功！每秒自动读取日志...')
				setUI(true)

				// 每秒轮询读取日志
				logTimer = setInterval(async () => {
					try {
						const v = await characteristic.readValue()
						const bytes = new Uint8Array(v.buffer)
						const text = new TextDecoder().decode(bytes).replace(/\0+$/, '').trim()
						if (text && text !== lastLog) { lastLog = text; log(text) }
					} catch (e) { }
				}, 1000)
			} catch (e) { log('失败: ' + e.message); console.error(e) }
		}

		function disconnect () {
			clearInterval(logTimer)
			if (device && device.gatt.connected) { device.gatt.disconnect(); log('已断开'); setUI(false) }
		}

		async function writeData () {
			const h = document.getElementById('hexInput').value.trim().replace(/\s/g, '')
			if (!h || h.length % 2) { log('HEX 格式错误'); return }
			const d = new Uint8Array(h.length / 2)
			for (let i = 0; i < h.length; i += 2) d[i / 2] = parseInt(h.substr(i, 2), 16)
			try { await characteristic.writeValue(d); log('已写入 NVS: ' + Array.from(d).map(b => b.toString(16).padStart(2, '0')).join(' ')) } catch (e) { log('写入失败: ' + e.message) }
		}

		async function readData () {
			try {
				const v = await characteristic.readValue()
				const bytes = new Uint8Array(v.buffer)
				const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ')
				let t = bytes.length; while (t > 0 && bytes[t - 1] === 0) t--
				const text = t > 0 ? String.fromCharCode(...bytes.slice(0, t)) : '(空)'
				document.getElementById('readResult').textContent = 'HEX: ' + hex + '\nASCII: ' + text
				log('读取 NVS (' + t + '字节): ' + text)
			} catch (e) { log('读取失败: ' + e.message) }
		}

		window.onload = () => {
			if (!('bluetooth' in navigator)) {
				document.getElementById('btnConnect').disabled = true
				document.getElementById('connStatus').textContent = '浏览器不支持 Web Bluetooth'
				document.getElementById('connStatus').className = 'status err'
				log('错误: 请使用 Chrome/Edge')
			} else { log('Web Bluetooth API 可用，请点击连接按钮') }
		};
	</script>
</body>

</html>
